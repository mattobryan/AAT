# Fixed-budget control at 0.75 x nominal training eps (same budget aat_full actually trained at). Evaluation still uses the
# fixed eval.seen eps (8/255, 0.5, 12). If aat_full does not beat this run, class-adaptive eps adds nothing at equal budget.
base: v3a_max.yaml
name: v3a_max_eps075
eps:
  linf: {nominal: 6/255}
  l2: {nominal: 0.375}
  l1: {nominal: 9.0}
