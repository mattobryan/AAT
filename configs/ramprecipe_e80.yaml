# Calibration run: our pipeline with RAMP's recipe, 80 epochs from scratch (no shared pretrain): linf + l1 only, max-CE + KL pairing (lambda 5),
# gradient projection, softplus1 PreActResNet-18, 10-step linf and l1 training attacks (PGD here, APGD in the official code). Our gradient
# projection uses the clean gradient of the same model, not the official per-epoch clean-trained copy. If this lands near the official
# 44.4 union / 81.3 clean, the pipeline is calibrated and allocation can be tested on top; if not, the gap is APGD or the clean-model fusion.
base: ramp.yaml
name: ramprecipe_e80
init_from: null
model: preactresnet18_softplus
train: {epochs: 80}
loss: {lambda_kl: 5.0}
attack: {linf: {steps: 10}}
monitor: {every: 10}
